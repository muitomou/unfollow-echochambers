seed: 42
n_nodes: 500

graph:
  type: "ws"
  k: 4
  p: 0.15

deffuant:
  epsilon: 0.2
  mu: 0.5

coevo:
  p_cut: 0.05          # probabilidad de cortar un enlace si se ignoran
  friend_of_friend: true
  max_attempts: 5       # intentos de reconexión

sim:
  n_steps: 10000
  snapshot_every: 500

io:
  results_dir: "experiments/results_coevo"
  figs_dir: "experiments/figs_coevo"
